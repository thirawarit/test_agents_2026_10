[project]
name = "md-rag"
version = "0.1.0"
description = "Local-only RAG over mixed Thai/English markdown, with file and heading citations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "langchain-core>=0.3",
    "langchain-ollama>=0.3",
    "langgraph>=0.4",
    "numpy>=1.26",
    "pythainlp>=5.0",
    "python-crfsuite>=0.9.10",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
md-rag = "md_rag.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/md_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a local Ollama server with bge-m3 and the generation model",
]
